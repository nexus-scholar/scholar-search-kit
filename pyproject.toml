[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholar-search-kit"
version = "0.1.0"
description = "Tutorial scholarly literature search toolkit for the harness project"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.1",
    "hishel==0.0.32",
    "rich>=13.9.4",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "vcrpy>=5.0.0"
]

[project.scripts]
scholar-search = "scholar_search.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_search"]