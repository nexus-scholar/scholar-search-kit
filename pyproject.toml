[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholar-search-kit"
version = "0.1.0"
description = "Tutorial scholarly literature search toolkit for the harness project"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
    "requests-cache>=1.1.0",
    "typer>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "vcrpy>=5.0.0"
]

[project.scripts]
scholar-search = "scholar_search.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_search"]